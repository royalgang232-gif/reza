<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>REZA — JARVIS AI Assistant</title>
    <meta name="description" content="Futuristic desktop and mobile AI assistant inspired by JARVIS with real-time background operation, continuous voice assistance, system telemetry, and internet search." />
    <meta property="og:title" content="REZA — JARVIS AI Assistant" />
    <meta property="og:description" content="Futuristic desktop and mobile AI assistant inspired by JARVIS with real-time background operation, continuous voice assistance, system telemetry, and internet search." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#04070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="REZA AI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#04070d] text-[#c9e1f5] antialiased selection:bg-cyan-500/30 selection:text-cyan-200 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA service worker for background persistence and offline capability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[REZA PWA] Service Worker registered with scope:', reg.scope);
          }).catch((err) => {
            console.warn('[REZA PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
